# СЭД — override для разъезда app/БД на 2 ВМ (задел по README п.2:
# "Разъезд на 2 ВМ — вынос db + смена DATABASE_URL"). Код не трогать — только compose-уровень.
#
# КАК ИСПОЛЬЗОВАТЬ (на app-ВМ):
#   1. В .env укажите DATABASE_URL на ВНЕШНЮЮ БД (ВМ баз данных), например:
#      DATABASE_URL=postgresql://changeme:changeme@example.com:5432/sed
#      (только плейсхолдер; реальный URL — от ИТ к тесту, в .env, не в git).
#   2. Запуск без локального db:
#      docker compose -f docker-compose.yml -f docker-compose.prod-db-external.yml up -d --scale db=0
#   3. Бэкапы внешней БД — pg_dump + снапшот на стороне ВМ баз данных (RPO 24ч/RTO 4ч, README п.5).
#
# ПОЧЕМУ ТАК: спец Compose не умеет УДАЛЯТЬ сервис override-файлом (нет стандартного
# '!reset'/'!override' для удаления; это расширения отдельных инструментов).
# Поэтому валидный для compose spec вариант: переопределить db (replicas: 0 для swarm)
# и фактически не стартовать его (--scale db=0), а api/worker перевести на внешний
# DATABASE_URL через тот же .env. Локальные тома pgdata/files/backups здесь не трогать.

services:
  api:
    environment:
      # На app-ВМ берется из .env и указывает на внешнюю БД. Без значения не стартовать.
      DATABASE_URL: ${DATABASE_URL}
  worker:
    environment:
      DATABASE_URL: ${DATABASE_URL}
  db:
    # Не стартует локально: в swarm — replicas 0, в обычном compose — --scale db=0 (см. шапку).
    deploy:
      replicas: 0
