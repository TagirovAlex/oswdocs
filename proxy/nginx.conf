# СЭД proxy — Nginx. Фаза 0 Задача 2 (devops-proxy).
#
# Шаблон для /etc/nginx/templates/default.conf.template (официальный
# entrypoint nginx:stable-alpine сам прогоняет envsubst при старте).
# Монтирование (см. docker-compose.yml, сервис proxy):
#   ./proxy/nginx.conf -> /etc/nginx/templates/default.conf.template:ro
#   certs (host /srv/sed/certs) -> /etc/nginx/certs:ro  (корп. cert/key от ИТ, read-only)
#   frontend build output (Фаза 5) -> /usr/share/nginx/html (статика React SPA)
# Переменная окружения:
#   SERVER_NAME — реальный intranet-домен от ИТ (compose прокидывает
#   SERVER_NAME=${SERVER_NAME:-sed.company.local}, дефолт-заглушка, не хардкод).
# Приватный key в образ НЕ копировать (только ro-mount на ВМ).

# --- HTTP: только 301 редирект на HTTPS. Наружу открыты только 80 и 443. ---
server {
    listen 80 default_server;
    server_name ${SERVER_NAME};

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: API-прокси + статика frontend. ---
server {
    listen 443 ssl;
    # Реальный домен дает ИТ к тесту (deploy/ЧЕК-ЛИСТ_ИТ.md). В коде не хардкодить.
    server_name ${SERVER_NAME};

    # Корп. сертификат (read-only mount). Пути фиксированы под mount compose;
    # при смене CERT_PATH подставить через envsubst-шаблон на старте.
    # compose: /srv/sed/certs:/etc/nginx/certs:ro
    ssl_certificate     /etc/nginx/certs/sed.crt;
    ssl_certificate_key /etc/nginx/certs/sed.key;

    # НФТ (README п.5): только TLS 1.2+
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS + security-заголовки (НФТ README п.5)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip для статики frontend
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
    gzip_comp_level 5;

    # API: сервис compose `api` слушает 8000 (см. Задачу 1, README п.2).
    # Трейлинг-слэш важен: /api/foo -> http://api:8000/foo (префикс /api/ срезается).
    location = /api {
        return 301 /api/;
    }
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Frontend: статика React SPA (Фаза 5 собирает сюда; сейчас — заглушка из Dockerfile).
    # index.html — no-cache: страница ссылается на хэшированные бандлы, браузер
    # должен всегда перевалидировать её, чтобы получить новые файлы после деплоя
    # (иначе Firefox по эвристике держит старую версию — «не видно изменений»).
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA-fallback: несуществующие пути отдает index.html (роутинг на клиенте).
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Ассеты со сборки: имя = хэш содержимого, можно кэшировать навсегда.
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
