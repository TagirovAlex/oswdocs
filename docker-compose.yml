# СЭД — docker-compose.yml (Фаза 0, Задача 1, агент: devops-compose).
# Стек по README п.1–п.2: proxy (nginx) + api/worker (локальный build ./api) + redis + db (postgres).
# Наружу — только 80 (редирект на 443) и 443 через proxy. У db внешнего порта НЕТ (README п.2, AGENTS.md п.4).
# Хост-каталоги: /srv/sed/{pgdata,files,backups,certs} (раскладка — deploy/LAYOUT.md, Задача 4).
# Запуск: docker compose --env-file .env up -d (ключи — .env.example).
# Разъезд на 2 ВМ: docker-compose.prod-db-external.yml (вынос db + смена DATABASE_URL), код не трогать.

services:
  proxy:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:-sed.company.local}
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${CERT_PATH:-/srv/sed/certs}:/etc/nginx/certs:ro
      # Статика SPA (S2b): именованный volume, наполняется из dist сборки
      # helper-контейнером без полного up; proxy только читает (ro).
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - sednet
    restart: unless-stopped

  api:
    build:
      context: ./api
    # Реальная точка входа — Фаза 2+ (FastAPI); здесь только контракт порта для proxy.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AD_URL: ${AD_URL}
      AD_BASE_DN: ${AD_BASE_DN}
      AD_READER_DN: ${AD_READER_DN}
      AD_READER_SECRET: ${AD_READER_SECRET}
      AD_TLS_VALIDATE: ${AD_TLS_VALIDATE:-false}
      AD_CA_CERT: ${AD_CA_CERT:-}
      LDAP_CACHE_TTL: ${LDAP_CACHE_TTL}
      ONEC_BASES_JSON: ${ONEC_BASES_JSON}
      AD_WRITE_ENABLED: ${AD_WRITE_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files:/app/files
      - backups:/app/backups:ro
      # Корневой CA для проверки LDAPS: ro-mount только файла CA в читаемый
      # путь (каталог certs — 700 root:docker, appuser его не читает; права
      # каталога не меняем, см. TASKS_TLS.md).
      - ${CERT_PATH:-/srv/sed/certs}/${CA_CERT_FILE:-fidelio-root-ca.pem}:/etc/ssl/certs/sed-ca.pem:ro
    networks:
      - sednet
    restart: unless-stopped

  worker:
    build:
      context: ./api
    # Тот же образ что api, другая команда (детали — Фаза 4: DOCX->PDF, SMTP, эскалация).
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AD_URL: ${AD_URL}
      AD_BASE_DN: ${AD_BASE_DN}
      AD_READER_DN: ${AD_READER_DN}
      AD_READER_SECRET: ${AD_READER_SECRET}
      AD_TLS_VALIDATE: ${AD_TLS_VALIDATE:-false}
      AD_CA_CERT: ${AD_CA_CERT:-}
      LDAP_CACHE_TTL: ${LDAP_CACHE_TTL}
      ONEC_BASES_JSON: ${ONEC_BASES_JSON}
      AD_WRITE_ENABLED: ${AD_WRITE_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - files:/app/files
      - backups:/app/backups:ro
      # Корневой CA для проверки LDAPS: ro-mount только файла CA в читаемый
      # путь (каталог certs — 700 root:docker, appuser его не читает; права
      # каталога не меняем, см. TASKS_TLS.md).
      - ${CERT_PATH:-/srv/sed/certs}/${CA_CERT_FILE:-fidelio-root-ca.pem}:/etc/ssl/certs/sed-ca.pem:ro
    networks:
      - sednet
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    # Внешнего порта нет: брокер + кэш только внутри сети sednet.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sednet
    restart: unless-stopped

  db:
    image: postgres:17-trixie
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sed}
      POSTGRES_USER: ${POSTGRES_USER:-sed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    # ports: НАМЕРЕННО НЕТ — доступ только внутри сети sednet (README п.2, AGENTS.md п.4).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sed} -d $${POSTGRES_DB:-sed}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sednet
    restart: unless-stopped

networks:
  sednet:
    driver: bridge

volumes:
  pgdata:
  files:
  backups:
  # Статика фронта для proxy (S2b, см. volumes сервиса proxy выше).
  frontend_dist:
